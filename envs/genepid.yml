name: genepid
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - abricate=1.0.1
  - biopython=1.85
  - blast
  - cgecore=1.5.6
  # KMA is dispatched to the pinned bactipipe-kma environment. ABRicate's
  # legacy zlib constraints conflict with modern KMA in a shared solve.
  - prodigal=2.6.3
  - tabulate=0.9.0
  - pip:
      - ete3==3.1.3
      - six==1.16.0
      - pyrodigal==3.5.2
